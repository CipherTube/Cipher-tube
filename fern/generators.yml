default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 0.15.0
        output:
          location: local-file-system
          path: ../sdks/typescript
        config:
          namespace: cipher-tube
          packageName: "@cipher-tube/sdk"
      - name: fernapi/fern-python-sdk
        version: 0.11.0
        output:
          location: local-file-system
          path: ../sdks/python
        config:
          packageName: "cipher_tube_sdk"
