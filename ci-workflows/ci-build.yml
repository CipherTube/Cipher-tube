# CypherTube CI builds — PLATFORM_SHIP_PLAN.md.
# Continuous verification that the installable tracks compile on every
# change to desktop/, ui/, or mobile/. No signing secrets needed here;
# signed artifacts are produced by release.yml on version tags.
name: ci-build

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'ui/**', 'mobile/**', '.github/workflows/ci-build.yml']
  pull_request:
    paths: ['desktop/**', 'ui/**', 'mobile/**']
  workflow_dispatch:

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Build (unsigned)
        run: npx electron-builder --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # CI builds are unsigned; signing happens in release.yml
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ciphertube-desktop-${{ matrix.os }}
          path: desktop/dist/**
          if-no-files-found: error

  android:
    name: android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      # The repo keeps only the custom security files under mobile/android;
      # `cap add` materializes the full Capacitor project fresh, then we
      # restore the hardened network security config over the template.
      - name: Preserve custom android files
        run: |
          mkdir -p /tmp/ct-scaffold/res/xml
          cp mobile/android/app/src/main/AndroidManifest.xml /tmp/ct-scaffold/
          cp mobile/android/app/src/main/res/xml/network_security_config.xml /tmp/ct-scaffold/res/xml/
      - name: Materialize Capacitor android project
        run: |
          rm -rf mobile/android
          cd mobile
          npm install --no-audit --no-fund
          npx cap add android
        env:
          CIPHERTUBE_GATEWAY_URL: ${{ vars.CIPHERTUBE_GATEWAY_URL }}
      - name: Restore hardened android config
        run: |
          cp /tmp/ct-scaffold/AndroidManifest.xml mobile/android/app/src/main/AndroidManifest.xml
          cp /tmp/ct-scaffold/res/xml/network_security_config.xml mobile/android/app/src/main/res/xml/network_security_config.xml
          echo 'apply from: "../../../signing.gradle"' >> mobile/android/app/build.gradle
      - name: Build debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ciphertube-android-debug
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
