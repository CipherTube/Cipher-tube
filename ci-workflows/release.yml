# CypherTube release builds — PLATFORM_SHIP_PLAN.md §build.
# Triggered by version tags (v1.6.0-beta.1, v1.6.0, ...). Produces
# SIGNED artifacts and attaches them to a GitHub Release.
#
# Required repo secrets (none are committed to the repo):
#   ANDROID_KEYSTORE_BASE64     base64-encoded .keystore file
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key password
#   MAC_CERT_BASE64             base64-encoded .p12 (maps to CSC_LINK)
#   MAC_CERT_PASSWORD           .p12 password (maps to CSC_KEY_PASSWORD)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   notarization
#   Optional: CIPHERTUBE_CERT_PIN (leaf-cert sha-256, hex) baked into desktop builds
#   Optional repo variable: CIPHERTUBE_GATEWAY_URL baked into the android build
name: release

on:
  push:
    tags: ['v1.6.0-*']

permissions:
  contents: write

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--mac --publish never'
          - os: windows-latest
            args: '--win --publish never'
          - os: ubuntu-latest
            args: '--linux --publish never'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Build (signed when secrets present)
        run: npx electron-builder ${{ matrix.args }}
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CIPHERTUBE_CERT_PIN: ${{ secrets.CIPHERTUBE_CERT_PIN }}
          CIPHERTUBE_GATEWAY_URL: ${{ vars.CIPHERTUBE_GATEWAY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}
          path: desktop/dist/**
          if-no-files-found: error

  android:
    name: android (signed APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Preserve custom android files
        run: |
          mkdir -p /tmp/ct-scaffold/res/xml
          cp mobile/android/app/src/main/AndroidManifest.xml /tmp/ct-scaffold/
          cp mobile/android/app/src/main/res/xml/network_security_config.xml /tmp/ct-scaffold/res/xml/
      - name: Materialize Capacitor android project
        run: |
          rm -rf mobile/android
          cd mobile
          npm install --no-audit --no-fund
          npx cap add android
        env:
          CIPHERTUBE_GATEWAY_URL: ${{ vars.CIPHERTUBE_GATEWAY_URL }}
      - name: Restore hardened android config + signing hookup
        run: |
          cp /tmp/ct-scaffold/AndroidManifest.xml mobile/android/app/src/main/AndroidManifest.xml
          cp /tmp/ct-scaffold/res/xml/network_security_config.xml mobile/android/app/src/main/res/xml/network_security_config.xml
          echo 'apply from: "../../../signing.gradle"' >> mobile/android/app/build.gradle
      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/ciphertube.keystore
      - name: Build signed release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          CIPHERTUBE_KEYSTORE_FILE: /tmp/ciphertube.keystore
          CIPHERTUBE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CIPHERTUBE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CIPHERTUBE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: attach artifacts to release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "CypherTube ${GITHUB_REF_NAME}" \
            --generate-notes \
            release-assets/**
