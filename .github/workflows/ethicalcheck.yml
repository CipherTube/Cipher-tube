name: EthicalCheck (disabled)

# The original workflow used apisec-inc/ethicalcheck-action, which has been
# deleted from GitHub, so every run failed at startup with an unresolvable
# action. Manual dispatch only until a replacement API scanner is chosen.
# Existing scanners in this repo: APIsec, CodeQL, Sentinel, MobSF.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder:
    name: Disabled pending replacement scanner
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: |
          echo "EthicalCheck action no longer exists on GitHub."
          echo "Replace with a supported API security scanner when one is selected."
