name: "🧙‍♂️ Wizard · Main Sentinel"

# Parked: this workflow needs GitHub-owned or third-party actions, which the
# organisation currently blocks (Settings > Actions > General). It runs only
# on manual dispatch so pushes stay green. Restore the original triggers once
# that policy allows those actions.
on:
  workflow_dispatch:

jobs:
  main-health-check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose and Repair
        run: |
          echo "Wizard monitoring main branch health..."
          # Logic to detect failure and trigger repair engine
          pnpm install --filter @cipher-tube/wizard...
          npx tsx wizard/src/index.ts --fix
