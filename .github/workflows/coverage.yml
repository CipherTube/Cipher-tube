name: Code Coverage

# Scope: the C2PA verification and audit/webhook suites. The other Python test
# modules in tests/ need SQLAlchemy and are covered by their own workflow.

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Run tests and report coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install dependencies
        working-directory: repo
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pytest-cov requests

      - name: Run tests with coverage
        working-directory: repo
        env:
          CIPHER_TUBE_ENV: test
        run: |
          python3 -m pytest \
            tests/test_c2pa_verification.py \
            tests/test_audit_and_webhook.py \
            -v --cov=simulators --cov-report=term-missing --cov-report=xml

      - name: Report coverage total
        working-directory: repo
        run: |
          if [ -f coverage.xml ]; then
            grep -o 'line-rate="[^"]*"' coverage.xml | head -1
          else
            echo "no coverage.xml produced"
          fi

      - name: Explain Codecov upload status
        run: |
          echo "Codecov upload is disabled: codecov/codecov-action cannot run under"
          echo "this repository's local-actions-only policy. Enable third-party"
          echo "actions in Settings > Actions > General to restore it."
