name: Container Job

# python:3.11-slim does not ship git, so the clone step installs it first.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-job:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      options: --cpus 2

    steps:
      - name: Install git in container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout repository
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Run inside container
        working-directory: repo
        run: |
          python -c "print('Running inside container')"
          python --version
