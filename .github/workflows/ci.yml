name: CipherTube CI

# Shell-only on purpose: this repository allows local actions only, so any
# `uses:` step fails at startup. Everything here runs through the shell.

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          # Check out the exact commit under test. A bare clone returns the
          # default branch, so pull requests were validating main, not themselves.
          git init -q repo && cd repo
          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          echo "commit: $(git rev-parse --short HEAD)"

      - name: Show toolchain
        run: |
          python3 --version
          node --version
          npm --version

      - name: Install Python dependencies
        working-directory: repo
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest requests fastapi uvicorn pydantic

      - name: Install Node dependencies
        working-directory: repo
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: repo
        run: npx tsc -p tsconfig.json --noEmit

      - name: Run C2PA verification tests
        working-directory: repo
        env:
          CIPHER_TUBE_ENV: test
        run: python3 -m pytest tests/test_c2pa_verification.py -v

      - name: Run audit and webhook tests
        working-directory: repo
        env:
          CIPHER_TUBE_ENV: test
        run: python3 -m pytest tests/test_audit_and_webhook.py -v

      - name: Validate Fern workspace definition
        working-directory: repo/fern
        continue-on-error: true
        run: |
          npm install -g fern-api
          fern check

      - name: Build local SDKs
        working-directory: repo/fern
        continue-on-error: true
        run: fern generate --group local --non-interactive
