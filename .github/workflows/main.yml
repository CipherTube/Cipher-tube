name: Build Container

# Rebuilt as a single valid workflow: the previous file was three workflows
# concatenated, which broke YAML parsing on the duplicate `name:` keys.
# GHCR requires a lowercase repository name, so the owner is lowercased first.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        working-directory: repo
        run: |
          OWNER_LC="$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="ghcr.io/${OWNER_LC}/cipher-tube"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${SHORT_SHA}" .

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:$(echo "${GITHUB_SHA}" | cut -c1-7)"
