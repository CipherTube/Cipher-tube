name: Build Container

# Rebuilt as a single valid workflow: the previous file was three workflows
# concatenated, which broke YAML parsing on the `name:` keys.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        working-directory: repo
        run: |
          docker build -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cipher-tube:latest" \
                       -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cipher-tube:${GITHUB_SHA::7}" .

      - name: Push image
        run: |
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cipher-tube:latest"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cipher-tube:${GITHUB_SHA::7}"
