name: Deploy Documentation

# Parked: this workflow needs GitHub-owned or third-party actions, which the
# organisation currently blocks (Settings > Actions > General). It runs only
# on manual dispatch so pushes stay green. Restore the original triggers once
# that policy allows those actions.
on:
  workflow_dispatch:

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
