name: Autofix

# Automated remediation. Never writes to main: it opens a branch and a pull
# request so a human still approves every change.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

env:
  # alerts and trace posts use these; each is optional and skipped when unset
  CI_HUB_URL: ${{ secrets.CI_HUB_URL }}
  CI_HUB_KEY: ${{ secrets.CI_HUB_KEY }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: Apply safe fixes and open a pull request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "ciphertube-autofix"
          git config user.email "autofix@users.noreply.github.com"

      - name: Install fixers
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff

      - name: Apply Python fixes
        working-directory: repo
        continue-on-error: true
        run: |
          ruff check simulators scripts --fix --exit-zero || true
          ruff format simulators scripts || true
          git diff --stat

      - name: Apply lockfile fixes
        working-directory: repo
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then
            npm audit fix --package-lock-only || true
            git diff --stat
          fi

      - name: Audit workflow permissions
        working-directory: repo
        continue-on-error: true
        run: python3 scripts/ci/normalise_permissions.py --check

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          . scripts/ci/lib.sh
          if git diff --quiet; then
            echo "nothing to fix"
            trace_record autofix "no-changes" 0
            notify success "Autofix on ${GITHUB_SHA:0:7}" "no automated fixes were needed"
            exit 0
          fi
          BRANCH="ci/autofix-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: automated lint and dependency fixes" -m "Generated by the Autofix workflow. Review before merging."
          git push origin "$BRANCH"
          python3 scripts/ci/open_pr.py "$BRANCH"
          trace_record autofix "branch:${BRANCH}" 0
          notify success "Autofix on ${GITHUB_SHA:0:7}" "opened ${BRANCH} for review"
